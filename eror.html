<style>
    body{
        background: linear-gradient(rgba(0, 0, 0.2, 0.2), #4b0202);
    }
.dad{
    margin: 200px auto;
    text-align: center;
}
.dad h1{

.dad .btn{
    margin: 20px auto;

    /* height: 50px; */

    border: 1px solid black;
    border-radius: 12px;
    background-color: whitesmoke;
}
.dad .btn a{
    color: black;
    text-decoration: none;
}

.span{
    width: 100%;
    background-color: black;
    border: 1PX solid black;
}

@keyframes loding {
    0%{
        transform: rotate(0deg);
    }
    25%{
        transform: rotate(45deg);
    }
    50%{
        transform: rotate(90deg);
    }
    75%{
        transform: rotate(135deg);
    }
    100%{
        transform: rotate(180deg);
    }
    
}

.loding{
    width: 50px;
    height: 50px;
    background-color: brown;
    margin: 20px auto;
    display: block;
    animation: loding 2000ms linear 0ms infinite normal ;
}

</style>
